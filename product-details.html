<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details - Aashir Packages</title>
<link rel="stylesheet" href="product-Detail.css">
</head>
<body>

<div class="container">
  <!-- Back Button -->
  <a href="products.html" class="back-button">← Back to Products</a>

  <!-- Product Details -->
  <div class="product-details">
    <div class="product-image-container">
      <img id="productImage" src="" alt="Product">
    </div>
    <div class="product-info">
      <h1 id="productTitle"></h1>
      <div id="productDesc" class="desc"></div>
      <p class="price">Price: Depends on Size, Material & Quantity</p>
      
      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="btn-primary" onclick="getQuote()">
          📞 Get Free Quote
        </button>
        <button class="btn-secondary" onclick="contactUs()">
          💬 Contact for Details
        </button>
      </div>
    </div>
  </div>

  <!-- Extra Images -->
  <div class="extra-images">
    <h2>More Views</h2>
    <div class="extra-img-list" id="extraImages"></div>
  </div>

  <!-- Order Form -->
  <div class="buy-section">
    <h2>Request Custom Order</h2>
    <form id="orderForm">
      <label for="customer_name">Your Name:</label>
      <input type="text" id="customer_name" name="customer_name" required placeholder="Enter your full name">

      <label for="customer_email">Email Address:</label>
      <input type="email" id="customer_email" name="customer_email" required placeholder="your.email@example.com">

      <label for="customer_phone">Phone Number:</label>
      <input type="tel" id="customer_phone" name="customer_phone" required placeholder="+92 XXX XXXXXX">

      <label for="formProductName">Product Interested In:</label>
      <input type="text" id="formProductName" name="product_name" value="Custom Box" readonly>

      <label for="quantity">Estimated Quantity:</label>
      <input type="number" id="quantity" name="quantity" value="100" min="50" required>

      <label for="special_requirements">Special Requirements:</label>
      <input type="text" id="special_requirements" name="special_requirements" placeholder="Size, color, printing, etc...">

      <button type="submit" id="submitBtn">
        <span id="btnText">📦 Request Quote</span>
        <span id="btnLoading" class="loading" style="display: none;"></span>
      </button>
    </form>

    <p id="orderMessage" style="display: none;"></p>
  </div>
</div>

<!-- Image Modal -->
<div class="image-modal" id="imageModal">
  <span class="close-modal">&times;</span>
  <img id="modalImage" src="" alt="Enlarged view">
</div>

<script>
  const products = {
    "Aqua Water Injection Box": {
      title:"Aqua Water Injection Box",
      image:"https://images.unsplash.com/photo-1623682687938-515344908afe?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0",
      description:`<h3>Product Overview</h3>
      <p>This product is specially designed for the pharmaceutical and medical industries as a sterile, safe packaging solution, ensuring that the solution remains free from contamination. The box holds high-grade injection water bottles or ampoules suitable for medical use.</p>
      
      <h3>Detailed Description</h3>
      <p>Our Aqua Water Injection Boxes are manufactured with precision to meet the highest standards of pharmaceutical packaging. The packaging includes leak-proof materials, anti-moisture lining, and protective inner inserts to prevent damage during transport. Each box is designed to withstand temperature variations and rough handling while maintaining product integrity.</p>
      
      <p>We use FDA-approved materials that ensure complete sterility and protection against environmental factors. The boxes feature secure closure mechanisms and are available in various sizes to accommodate different vial capacities.</p>

      <h3>Key Features:</h3>
      <ul>
        <li>Sterile, pyrogen-free packaging meeting medical standards</li>
        <li>Leak-proof, moisture-resistant material with barrier protection</li>
        <li>Strong structural design to protect during shipping and storage</li>
        <li>Easy handling and secure closure mechanism</li>
        <li>Custom labeling and batch coding available</li>
        <li>Temperature-resistant construction</li>
        <li>Available in multiple size configurations</li>
      </ul>

      <h3>Usage Scenarios:</h3>
      <ul>
        <li>Safe transport of medical vials or ampoules</li>
        <li>Hospital and clinic inventory distribution systems</li>
        <li>Vaccine or injectable drug supply chain management</li>
        <li>Packaging for clean-room or sterile environments</li>
        <li>Pharmaceutical manufacturing and distribution</li>
        <li>Medical research and laboratory use</li>
      </ul>

      <h3>Customization Options:</h3>
      <ul>
        <li>Custom sizes and dimensions</li>
        <li>Brand-specific printing and labeling</li>
        <li>Batch number and expiry date printing</li>
        <li>Special interior compartments</li>
        <li>Security features and tamper evidence</li>
      </ul>`,
      extraImages:[ 
        "https://www.firstaiddistributions.com.au/cdn/shop/files/water-for-injection-10ml-box-20-default-title-127179-44729758220502.jpg?v=1743484011&width=1946",
        "https://www.biolink.com/uploads/image/20240906/15/hydrolinx-water-for-injection-in-bottles-exporter.webp"
      ]
    },
    "Pizza Box": {
      title:"Pizza Box",
      image:"https://images.unsplash.com/photo-1632657597174-2a89667b468f?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0",
      description:`<h3>Product Overview</h3>
      <p>These pizza boxes are specially designed to maintain the perfect temperature and freshness of your pizzas during delivery or takeaway. Made from eco-friendly, high-quality cardboard, they ensure your pizza reaches customers intact and delicious.</p>
      
      <h3>Detailed Description</h3>
      <p>Our premium pizza boxes are engineered with advanced ventilation technology that locks in heat while allowing just enough air circulation to prevent sogginess. The grease-resistant coating ensures that the box maintains its structural integrity even with the oiliest pizzas. The reinforced corners and secure locking mechanism prevent accidental opening during transport.</p>
      
      <p>We use food-grade, recyclable materials that are both environmentally friendly and durable. The boxes are available in round and square designs to accommodate different pizza styles and sizes.</p>

      <h3>Key Features:</h3>
      <ul>
        <li>Eco-friendly, 100% recyclable cardboard material</li>
        <li>Advanced grease-resistant coating technology</li>
        <li>Secure locking mechanism to prevent spillage</li>
        <li>Customizable branding with high-quality printing</li>
        <li>Available in multiple sizes (10", 12", 14", 16")</li>
        <li>Heat retention technology for longer freshness</li>
        <li>Stackable design for efficient storage</li>
      </ul>

      <h3>Usage Scenarios:</h3>
      <ul>
        <li>Pizza delivery and takeaway services</li>
        <li>Restaurants and pizzerias of all sizes</li>
        <li>Food festivals and catering events</li>
        <li>Bulk orders for parties and corporate events</li>
        <li>Food trucks and mobile pizza vendors</li>
        <li>School and institutional food services</li>
      </ul>

      <h3>Customization Options:</h3>
      <ul>
        <li>Full-color brand printing</li>
        <li>Custom sizes and shapes</li>
        <li>Special coatings (matte, gloss, waterproof)</li>
        <li>Window cutouts for product display</li>
        <li>Handles for easy carrying</li>
        <li>Special compartments for sauces and sides</li>
      </ul>`,
      extraImages:[
        "https://media.istockphoto.com/id/483857665/photo/brown-pizza-box.webp?a=1&b=1&s=612x612&w=0&k=20&c=29QUYmgsBRc810FRi7kQgBDmxAQniFdkEr6XU0CE1kI=", 
        "https://images.unsplash.com/photo-1600359773269-0e5197c3829b?q=80&w=1169&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
      ]
    }
    // Add other products with similar detailed descriptions
  };

  // Button action functions
  function getQuote() {
    const productName = document.getElementById("productTitle").textContent;
    const message = `Hello! I'm interested in getting a quote for ${productName}. Please provide me with pricing details and available options.`;
    const whatsappUrl = `https://wa.me/923000202001?text=${encodeURIComponent(message)}`;
    window.open(whatsappUrl, '_blank');
  }

  function contactUs() {
    const productName = document.getElementById("productTitle").textContent;
    const message = `I would like more information about ${productName}. Could you please share detailed specifications, customization options, and lead times?`;
    const whatsappUrl = `https://wa.me/923000202001?text=${encodeURIComponent(message)}`;
    window.open(whatsappUrl, '_blank');
  }

  function loadProductFromURL() {
    const params = new URLSearchParams(window.location.search);
    const productName = params.get("title") || "Aqua Water Injection Box";
    const product = products[productName];
    
    if (!product) {
      document.body.innerHTML = '<div class="container" style="text-align: center; padding: 50px;"><h2>Product Not Found</h2><p>The requested product could not be found.</p><a href="products.html" class="back-button">Back to Products</a></div>';
      return;
    }

    document.getElementById("productTitle").textContent = product.title;
    document.getElementById("productImage").src = product.image;
    document.getElementById("productImage").alt = product.title;
    document.getElementById("productDesc").innerHTML = product.description;
    document.getElementById("formProductName").value = product.title;

    const extraImagesDiv = document.getElementById("extraImages");
    extraImagesDiv.innerHTML = "";
    
    if (product.extraImages && product.extraImages.length > 0) {
      product.extraImages.forEach(img => {
        const imgTag = document.createElement("img");
        imgTag.src = img;
        imgTag.alt = product.title + " view";
        imgTag.loading = "lazy";
        imgTag.addEventListener('click', () => openImageModal(img));
        extraImagesDiv.appendChild(imgTag);
      });
    } else {
      extraImagesDiv.innerHTML = '<p style="text-align: center; color: #666;">No additional images available</p>';
    }
  }

  // Image Modal functionality
  function openImageModal(imgSrc) {
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    modal.style.display = 'flex';
    modalImg.src = imgSrc;
  }

  function closeImageModal() {
    document.getElementById('imageModal').style.display = 'none';
  }

  // Order Form functionality
  document.getElementById("orderForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const name = this.customer_name.value.trim();
    const email = this.customer_email.value.trim();
    const phone = this.customer_phone.value.trim();
    const product = this.product_name.value.trim();
    const quantity = this.quantity.value;
    const requirements = this.special_requirements.value.trim();

    if (!name || !email || !phone) {
      alert("Please fill all required fields!");
      return;
    }

    // Show loading state
    const btnText = document.getElementById('btnText');
    const btnLoading = document.getElementById('btnLoading');
    const submitBtn = document.getElementById('submitBtn');
    
    btnText.style.display = 'none';
    btnLoading.style.display = 'inline-block';
    submitBtn.disabled = true;

    // Simulate order processing
    setTimeout(() => {
      const message = `✅ Thank you ${name}! Your quote request for ${quantity} ${product}(s) has been received. We'll contact you within 24 hours at ${email} or ${phone}.`;
      
      document.getElementById("orderMessage").textContent = message;
      document.getElementById("orderMessage").style.display = 'block';
      
      // Reset form and button state
      this.reset();
      document.getElementById("formProductName").value = product;
      document.getElementById("quantity").value = "100";
      btnText.style.display = 'inline-block';
      btnLoading.style.display = 'none';
      submitBtn.disabled = false;
      
      // Scroll to message
      document.getElementById("orderMessage").scrollIntoView({ behavior: 'smooth' });
    }, 1500);
  });

  // Close modal when clicking X or outside image
  document.querySelector('.close-modal').addEventListener('click', closeImageModal);
  document.getElementById('imageModal').addEventListener('click', function(e) {
    if (e.target === this) closeImageModal();
  });

  // Close modal with Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeImageModal();
  });

  // Load product when page loads
  document.addEventListener('DOMContentLoaded', loadProductFromURL);
</script>

</body>
</html>
