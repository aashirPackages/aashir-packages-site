<title>Product Details</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f9f9f9; color:#333; }
  .product-details { display:flex; gap:30px; margin:40px auto; max-width:1000px; background:#fff; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
  .product-details img { width:500px; border-radius:10px; object-fit:cover; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
  .product-info { flex:1; display:flex; flex-direction:column; }
  .product-info h1 { font-size:28px; margin-bottom:15px; }
  .desc h3 { margin-top:20px; }
  .desc p, .desc ul { line-height:1.6; font-size:16px; }
  .price { margin-top:25px; font-size:20px; font-weight:bold; color:#27ae60; }
  .extra-images { margin:40px auto; max-width:1000px; }
  .extra-images h2 { font-size:22px; margin-bottom:15px; }
  .extra-img-list { display:flex; gap:15px; flex-wrap:wrap; }
  .extra-img-list img { width:200px; height:auto; border-radius:8px; object-fit:cover; border:1px solid #ddd; }
  .buy-section { max-width:500px; margin:40px auto; padding:25px; border-radius:12px; background:#ffffff; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
  .buy-section h2 { text-align:center; margin-bottom:20px; }
  .buy-section label { display:block; font-weight:600; margin-bottom:5px; }
  .buy-section input { width:100%; padding:10px; margin-bottom:18px; border:1px solid #ccc; border-radius:8px; font-size:14px; }
  .buy-section button { width:100%; padding:12px; background:#3498db; color:white; font-size:16px; font-weight:600; border:none; border-radius:8px; cursor:pointer; }
  .buy-section button:hover { background:#2980b9; }
</style>
</head>

<div class="product-details">
  <img id="productImage" src="" alt="Product">
  <div class="product-info">
    <h1 id="productTitle"></h1>
    <div id="productDesc" class="desc"></div>
    <p class="price">Price: Depend on Size, Material & Quantity </p>
  </div>
</div>

<div class="extra-images">
  <h2>More Views</h2>
  <div class="extra-img-list" id="extraImages"></div>
</div>

<div class="buy-section">
  <h2>Order Now</h2>
  <form id="orderForm">
    <label>Name:</label>
    <input type="text" name="customer_name" required>

    <label>Email:</label>
    <input type="email" name="customer_email" required>

    <label>Product:</label>
    <input type="text" name="product_name" id="formProductName" value="Custom Box" readonly>

    <label>Quantity:</label>
    <input type="number" name="quantity" value="1" min="1">

    <button type="submit">Buy Now</button>
  </form>

  <p id="orderMessage" style="margin-top:10px; color:green; font-weight:bold;"></p>
</div>

<script>
  document.getElementById("orderForm").addEventListener("submit", function(event) {
    event.preventDefault(); // stop page reload

    const name = this.customer_name.value.trim();
    const email = this.customer_email.value.trim();
    const product = this.product_name.value.trim();
    const quantity = this.quantity.value;

    if (!name || !email) {
      alert("Please fill all required fields!");
      return;
    }

    // simulate order processing
    const message = `✅ Thank you ${name}! Your order for ${quantity} ${product}(s) has been received. We’ll contact you soon at ${email}.`;

    document.getElementById("orderMessage").textContent = message;

    // reset form
    this.reset();
  });
</script>



<div class="product-detail container">
  <div class="detail-image">
    <img src="your-image.jpg" alt="Product Image">
  </div>
  <div class="detail-info">
    <h2>Box Title</h2>

    <button>Order Now</button>

function loadProductFromURL() {
  const params = new URLSearchParams(window.location.search);
  const productName = params.get("title") || "Aqua Water Injection Box";
  const product = products[productName];
  if (!product) return;

  document.getElementById("productTitle").textContent = product.title;
  document.getElementById("productImage").src = product.image;
  document.getElementById("productImage").alt = product.title;
  document.getElementById("productDesc").innerHTML = product.description;
  document.getElementById("productPrice").textContent = product.price;
  document.getElementById("formProductName").value = product.title;

  const extraImagesDiv = document.getElementById("extraImages");
  extraImagesDiv.innerHTML = "";
  product.extraImages.forEach(img => {
    const imgTag = document.createElement("img");
    imgTag.src = img;
    imgTag.alt = product.title + " view";
    extraImagesDiv.appendChild(imgTag);
  });
}
